<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand.css">
<style>
  .frame { --w: 1080px; --h: 1080px; }
  .logo { position: absolute; top: 64px; left: 72px; font-size: 34px; }
  .handle { right: 72px; bottom: 66px; font-size: 20px; }
  .eyebrow { position: absolute; top: 250px; left: 72px; font-size: 24px; }
  .display {
    position: absolute; top: 310px; left: 72px;
    font-size: 92px; max-width: 860px;
  }
  .moon { width: 430px; height: 430px; right: -70px; bottom: -130px; }
  .ring {
    position: absolute; width: 620px; height: 620px;
    right: -160px; bottom: -220px; border-radius: 50%;
    border: 1.5px solid rgba(217,185,140,.5);
    box-shadow: 0 0 0 70px rgba(217,185,140,.08), 0 0 0 150px rgba(217,185,140,.045);
  }
  .dot i { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--latte); opacity: .9; }
  .dot i:nth-child(2) { width: 10px; height: 10px; opacity: .55; }
  .dot i:nth-child(3) { width: 8px; height: 8px; opacity: .4; }
  .badge {
    position: absolute; top: 120px; right: 90px;
    width: 210px; height: 210px; font-size: 15px; gap: 6px;
    transform: rotate(10deg);
    background: rgba(22,19,15,.35);
  }
  .footer-line {
    position: absolute; left: 72px; top: 760px;
    font-size: 26px; line-height: 1.5; color: var(--latte); max-width: 560px;
  }
  .dots { position: absolute; left: 72px; bottom: 70px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="stars"></div>
    <div class="ring"></div>
    <div class="dot">
      <i style="right:430px;bottom:430px"></i>
      <i style="right:520px;bottom:280px"></i>
      <i style="right:210px;bottom:520px"></i>
    </div>
    <div class="moon"></div>
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="logo">Roast Theory<span class="reg">®</span></div>
    <div class="eyebrow">Batch Nº 07</div>
    <h1 class="display">Roasted small.<br>Shipped fresh.<br><span class="serif-i">Gone by midnight.</span></h1>
    <div class="badge"><span>Batch</span><span class="big">07</span><span>500 bags</span></div>
    <p class="footer-line">One roast day. One city at a time. When the counter hits zero, Batch Nº 08 is a different coffee.</p>
    <div class="dots"><span></span><span></span><span class="on"></span><span></span></div>
    <div class="handle">@roasttheory</div>
  </div>
</body>
</html>
