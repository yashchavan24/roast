<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Roast Theory — IG Carousel (4 slides, 1080×1080)</title>
<style>
  body { margin: 0; background: #0a0908; color: #f4ead8; font-family: Georgia, serif; }
  header { padding: 40px 48px 8px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
  p { margin: 6px 0 0; color: #8a6a4f; font-size: 14px; font-family: Arial, sans-serif; }
  .grid {
    display: grid; grid-template-columns: repeat(2, 540px);
    gap: 32px; padding: 32px 48px 48px;
  }
  .cell { margin: 0; }
  .fit { width: 540px; height: 540px; overflow: hidden; border: 1px solid #2a211a; }
  iframe { width: 1080px; height: 1080px; border: 0; transform: scale(.5); transform-origin: top left; display: block; }
  figcaption { margin-top: 10px; color: #d9b98c; font-size: 13px; font-family: Arial, sans-serif; letter-spacing: .08em; }
</style>
</head>
<body>
  <header>
    <h1>Project 1 — Instagram Carousel</h1>
    <p>Roast Theory® · "Midnight Roast" drop · 4 slides · 1080 × 1080 · same headline language + crema-moon motif throughout</p>
  </header>
  <div class="grid">
    <figure class="cell">
      <div class="fit"><iframe src="slide-1.html" title="Slide 1"></iframe></div>
      <figcaption>01 / HERO — campaign hook</figcaption>
    </figure>
    <figure class="cell">
      <div class="fit"><iframe src="slide-2.html" title="Slide 2"></iframe></div>
      <figcaption>02 / PRODUCT — flavor story</figcaption>
    </figure>
    <figure class="cell">
      <div class="fit"><iframe src="slide-3.html" title="Slide 3"></iframe></div>
      <figcaption>03 / TRUST — small-batch scarcity</figcaption>
    </figure>
    <figure class="cell">
      <div class="fit"><iframe src="slide-4.html" title="Slide 4"></iframe></div>
      <figcaption>04 / CTA — offer + code</figcaption>
    </figure>
  </div>
</body>
</html>
