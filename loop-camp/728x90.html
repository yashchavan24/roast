<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  /* ===== 728x90 leaderboard — flex-packed, not pixel-pinned =================
     Old bug: every element sat on a hardcoded `left:` offset tuned to
     fallback fonts. When the real webfonts load (~15% wider), the yellow
     "Free trial" chip slid under the CTA pinned at right:18px. Now the row
     packs with flexbox: elements push each other instead of colliding and
     margin-left:auto absorbs the slack, so no font metric can overlap them. */
  .frame { --w: 728px; --h: 90px; display: flex; }
  .bar   { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  .logo  { font-size: 14px; flex: none; }
  .copy  { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .eyebrow { font-size: 8px; white-space: nowrap; }
  .display { font-size: 20px; white-space: nowrap; }
  .meta  { flex: none; margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .chip  { font-size: 9.5px; padding: 8px 12px; letter-spacing: .1em; }
  .chip.a { background: var(--cloud); }
  .chip.b { background: var(--sunshine); }
  .btn   { font-size: 10px; padding: 11px 16px; box-shadow: 0 4px 0 var(--grape-dark); }
</style>
</head>
<body>
  <div class="frame">
    <div class="bar">
      <div class="logo"><span class="mark"><i></i><i></i><i></i><i></i></span>Loop Camp</div>
      <div class="copy">
        <div class="eyebrow">Summer of Code · Ages 8–14</div>
        <h1 class="display">They build <span class="accent">the game.</span></h1>
      </div>
      <div class="meta">
        <div class="chip a">Jun 2 – Jul 11</div>
        <div class="chip b">Free trial</div>
        <div class="btn">Save a seat →</div>
      </div>
    </div>
  </div>
</body>
</html>
