<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand.css">
<style>
  /* 160×600 SKYSCRAPER — vertical reading order: logo → moon → hook → offer → CTA */
  /* pin frame to viewport corner: headless capture crops the top-left 160×600,
     and fixed positioning is immune to any body-layout centering quirks */
  html, body { display: block; }
  .frame { --w: 160px; --h: 600px; position: fixed; top: 0; left: 0; margin: 0; }
  .logo { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font-size: 12px; }
  .moon {
    width: 118px; height: 118px; top: 86px; left: 50%; transform: translateX(-50%);
  }
  .eyebrow {
    position: absolute; top: 236px; left: 0; right: 0; text-align: center;
    font-size: 7px; letter-spacing: .26em; font-weight: 600;
    text-transform: uppercase; color: var(--latte);
  }
  .display {
    position: absolute; top: 260px; left: 16px; font-size: 29px; line-height: 1;
    text-align: left; max-width: 134px;
  }
  .coupon {
    position: absolute; top: 470px; left: 50%; transform: translateX(-50%);
    font-size: 8px; letter-spacing: .1em; padding: 7px 9px; white-space: nowrap;
  }
  .watermark {
    position: absolute; right: -14px; bottom: 74px;
    font-family: var(--display); font-weight: 700; font-size: 190px; line-height: 1;
    color: rgba(217,185,140,.08); pointer-events: none;
  }
  .cta {
    position: absolute; left: 14px; right: 14px; bottom: 24px;
    font-size: 9.5px; padding: 12px 8px; justify-content: center;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="grain"></div>
    <div class="logo">Roast<br>Theory<span class="reg">®</span></div>
    <div class="eyebrow">Midnight Roast · Batch 07</div>
    <h1 class="display">500 bags.<br>Then <span class="serif-i accent">gone.</span></h1>
    <div class="coupon">NIGHTOWL<br>15% OFF</div>
    <div class="watermark">07</div>
    <div class="cta">Shop the drop</div>
  </div>
</body>
</html>
