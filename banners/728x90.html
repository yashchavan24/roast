<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand.css">
<style>
  /* 728×90 LEADERBOARD — one-line hierarchy: logo | hook | CTA (code in eyebrow) */
  .frame { --w: 728px; --h: 90px; }
  .logo {
    position: absolute; top: 50%; left: 24px; transform: translateY(-50%);
    font-size: 16px;
  }
  .eyebrow {
    position: absolute; top: 20px; left: 164px; font-size: 8px;
    letter-spacing: .26em;
  }
  .display {
    position: absolute; top: 52%; left: 164px; transform: translateY(-50%);
    font-size: 27px; white-space: nowrap;
  }
  .moon { width: 150px; height: 150px; right: -70px; top: -30px; opacity: .92; }
  .cta {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    font-size: 10.5px; padding: 11px 18px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="grain"></div>
    <div class="logo">Roast Theory<span class="reg">®</span></div>
    <div class="eyebrow">Midnight Roast · Batch 07 · Code: Nightowl</div>
    <h1 class="display">500 bags. Then <span class="serif-i accent">gone.</span></h1>
    <div class="cta">Shop the drop →</div>
  </div>
</body>
</html>
